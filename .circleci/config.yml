version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  classification:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification"}]
  mapped-files:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal mapped-files"}]
  native-files:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal native-files"}]
  clusters:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal clusters"}]
  extra-links:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal extra-links"}]
  overlaps:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal overlaps"}]

workflows:
  internal-classification-probes:
    jobs:
      - classification
      - mapped-files
      - native-files
      - clusters
      - extra-links
      - overlaps
