version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  search-assets:
    executor: py
    steps:
      - checkout
      - run:
          name: Regenerate search assets and require zero diff
          command: |
            set -euo pipefail
            python tools/generate_search_assets.py
            git diff --exit-code -- sitemap.xml feed.xml data/seo/page-intents.json
  internal-links:
    executor: py
    steps:
      - checkout
      - run:
          name: Require generated wiring plan and blocks to be current
          command: python tools/internal_links.py --check
  intent-json:
    executor: py
    steps:
      - checkout
      - run:
          name: Validate intent manifest JSON and graph route
          command: python -c "import json,pathlib; d=json.loads(pathlib.Path('data/seo/page-intents.json').read_text()); r=[x['route'] for x in d['pages']]; assert '/blog/graph-topology-multi-agent-research-workflow.html' in r and len(r)==len(set(r))"

workflows:
  generated-metadata-validation:
    jobs:
      - search-assets
      - internal-links
      - intent-json
