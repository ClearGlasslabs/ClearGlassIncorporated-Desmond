version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  root-a-f:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-a-f"}]
  root-g-l:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-g-l"}]
  root-m-r:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-m-r"}]
  root-s-z:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-s-z"}]
  root-other:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-other"}]

workflows:
  root-classification-location:
    jobs:
      - root-a-f
      - root-g-l
      - root-m-r
      - root-s-z
      - root-other
