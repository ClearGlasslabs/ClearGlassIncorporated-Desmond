version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  internal-validate:
    executor: py
    steps:
      - checkout
      - run: python scripts/circleci_probe.py internal validate
  internal-report:
    executor: py
    steps:
      - checkout
      - run: python scripts/circleci_probe.py internal report
  internal-blocks:
    executor: py
    steps:
      - checkout
      - run: python scripts/circleci_probe.py internal blocks
  search-sitemap:
    executor: py
    steps:
      - checkout
      - run: python scripts/circleci_probe.py search sitemap.xml
  search-feed:
    executor: py
    steps:
      - checkout
      - run: python scripts/circleci_probe.py search feed.xml
  search-intents:
    executor: py
    steps:
      - checkout
      - run: python scripts/circleci_probe.py search data/seo/page-intents.json

workflows:
  generated-integrity-probes:
    jobs:
      - internal-validate
      - internal-report
      - internal-blocks
      - search-sitemap
      - search-feed
      - search-intents
