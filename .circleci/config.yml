version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project
commands:
  install-osit:
    steps:
      - run: python -m pip install -e './osit[dev]'
jobs:
  e4:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check --select E4 src/osit/config.py"}]
  e7:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check --select E7 src/osit/config.py"}]
  e9:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check --select E9 src/osit/config.py"}]
  up037:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check --select UP037 src/osit/config.py"}]
  up038:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check --select UP038 src/osit/config.py"}]
workflows:
  pinpoint:
    jobs: [e4, e7, e9, up037, up038]
