version: 2.1
executors:
  py:
    docker:
      - image: cimg/python:3.11-node
jobs:
  app:
    executor: py
    steps: [checkout, {run: "python scripts/sitemap_ops_probe.py app"}]
  investors:
    executor: py
    steps: [checkout, {run: "python scripts/sitemap_ops_probe.py investors"}]
  client:
    executor: py
    steps: [checkout, {run: "python scripts/sitemap_ops_probe.py client"}]
  federal:
    executor: py
    steps: [checkout, {run: "python scripts/sitemap_ops_probe.py federal"}]
  hubspot:
    executor: py
    steps: [checkout, {run: "python scripts/sitemap_ops_probe.py hubspot"}]
  ontario:
    executor: py
    steps: [checkout, {run: "python scripts/sitemap_ops_probe.py ontario"}]
  procurement:
    executor: py
    steps: [checkout, {run: "python scripts/sitemap_ops_probe.py procurement"}]
  stripe:
    executor: py
    steps: [checkout, {run: "python scripts/sitemap_ops_probe.py stripe"}]
workflows:
  sitemap-ops-routes:
    jobs: [app, investors, client, federal, hubspot, ontario, procurement, stripe]
