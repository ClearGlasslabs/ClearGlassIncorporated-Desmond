version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  sitemap-blog:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py sitemap-group-blog"}]
  sitemap-offers:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py sitemap-group-offers"}]
  sitemap-legal:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py sitemap-group-legal"}]
  sitemap-ops:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py sitemap-group-ops"}]
  sitemap-products:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py sitemap-group-products"}]
  sitemap-root:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py sitemap-group-root"}]
  intent-blog:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py intent-group-blog"}]
  intent-offers:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py intent-group-offers"}]
  intent-legal:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py intent-group-legal"}]
  intent-ops:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py intent-group-ops"}]
  intent-products:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py intent-group-products"}]
  intent-root:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py intent-group-root"}]

workflows:
  stale-metadata-groups:
    jobs: [sitemap-blog, sitemap-offers, sitemap-legal, sitemap-ops, sitemap-products, sitemap-root, intent-blog, intent-offers, intent-legal, intent-ops, intent-products, intent-root]
