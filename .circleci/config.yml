version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  reliability:
    executor: py
    steps:
      - checkout
      - run: python scripts/site_reliability_audit.py
  search-assets:
    executor: py
    steps:
      - checkout
      - run: |
          python tools/generate_search_assets.py
          git diff --exit-code -- sitemap.xml feed.xml data/seo/page-intents.json
  seo:
    executor: py
    steps:
      - checkout
      - run: python tools/seo_audit.py
  links:
    executor: py
    steps:
      - checkout
      - run: python tools/internal_links.py --check
  doctor:
    executor: py
    steps:
      - checkout
      - run: python -m pip install "PyYAML==6.0.2"
      - run: python scripts/workflow_doctor.py
  actions-audit:
    executor: py
    steps:
      - checkout
      - run: python -m pip install "PyYAML==6.0.2"
      - run: python scripts/audit_github_actions.py
  osint:
    executor: py
    steps:
      - checkout
      - run: python scripts/osint_deck_release.py --strict

workflows:
  final-site-integrity:
    jobs: [reliability, search-assets, seo, links, doctor, actions-audit, osint]
