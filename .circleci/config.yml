version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

commands:
  install-osit:
    steps:
      - run: python -m pip install -e './osit[dev]'

jobs:
  accessibility:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check src/osit/accessibility.py"}]
  acquisition:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check src/osit/acquisition.py"}]
  cli:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check src/osit/cli.py"}]
  config:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check src/osit/config.py"}]

workflows:
  osit-source-file-diagnostics:
    jobs:
      - accessibility
      - acquisition
      - cli
      - config
