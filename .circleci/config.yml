version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  unknown-da-s-z:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal unknown-da-s-z"}]
  missing-da-s-z:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal missing-da-s-z"}]
  unknown-da-other:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal unknown-da-other"}]
  missing-da-other:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal missing-da-other"}]

workflows:
  da-classification-direction:
    jobs:
      - unknown-da-s-z
      - missing-da-s-z
      - unknown-da-other
      - missing-da-other
