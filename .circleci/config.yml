version: 2.1
executors:
  py:
    docker:
      - image: cimg/python:3.11-node
jobs:
  headers:
    executor: py
    steps: [checkout, {run: "python scripts/intent_probe_correct.py headers"}]
  routes:
    executor: py
    steps: [checkout, {run: "python scripts/intent_probe_correct.py routes"}]
  existing:
    executor: py
    steps: [checkout, {run: "python scripts/intent_probe_correct.py existing"}]
  graph:
    executor: py
    steps: [checkout, {run: "python scripts/intent_probe_correct.py graph"}]
workflows:
  corrected-intent-probes:
    jobs: [headers, routes, existing, graph]
