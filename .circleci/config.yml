version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  search-assets:
    executor: py
    steps:
      - checkout
      - run:
          name: Regenerate search assets and require zero diff
          command: |
            set -euo pipefail
            python tools/generate_search_assets.py
            git diff --exit-code -- sitemap.xml feed.xml data/seo/page-intents.json
  internal-links:
    executor: py
    steps:
      - checkout
      - run:
          name: Require generated wiring plan and blocks to be current
          command: python tools/internal_links.py --check
  intent-json:
    executor: py
    steps:
      - checkout
      - run:
          name: Validate intent manifest JSON and graph route
          command: |
            python - <<'PY'
            import json
            from pathlib import Path
            doc = json.loads(Path('data/seo/page-intents.json').read_text(encoding='utf-8'))
            routes = {row['route'] for row in doc['pages']}
            assert '/blog/graph-topology-multi-agent-research-workflow.html' in routes
            assert len(routes) == len(doc['pages'])
            PY

workflows:
  generated-metadata-validation:
    jobs:
      - search-assets
      - internal-links
      - intent-json
