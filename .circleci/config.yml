version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  sitemap:
    executor: py
    steps:
      - checkout
      - run:
          name: Require canonical sitemap
          command: |
            python tools/generate_search_assets.py
            git diff --exit-code -- sitemap.xml
  feed:
    executor: py
    steps:
      - checkout
      - run:
          name: Require canonical Atom feed
          command: |
            python tools/generate_search_assets.py
            git diff --exit-code -- feed.xml
  intents:
    executor: py
    steps:
      - checkout
      - run:
          name: Require canonical intent serialization
          command: |
            python -c "from pathlib import Path; p=Path('data/seo/page-intents.json'); p.write_text(p.read_text(encoding='utf-8').rstrip('\\n')+'\\n', encoding='utf-8')"
            cp data/seo/page-intents.json /tmp/page-intents.json
            python tools/generate_search_assets.py
            cmp /tmp/page-intents.json data/seo/page-intents.json
  internal-links:
    executor: py
    steps:
      - checkout
      - run:
          name: Require canonical wiring plan and generated blocks
          command: python tools/internal_links.py --check

workflows:
  canonical-generated-assets:
    jobs:
      - sitemap
      - feed
      - intents
      - internal-links
