version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

commands:
  setup:
    steps:
      - run: python -m pip install "PyYAML==6.0.2"

jobs:
  actions-20-30:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py actions 20 30"}]
  actions-30-40:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py actions 30 40"}]
  actions-40-50:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py actions 40 50"}]
  actions-50-60:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py actions 50 60"}]
  doctor-20-30:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py doctor 20 30"}]
  doctor-30-40:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py doctor 30 40"}]
  doctor-40-50:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py doctor 40 50"}]
  doctor-50-60:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py doctor 50 60"}]

workflows:
  workflow-safety-bisect:
    jobs:
      - actions-20-30
      - actions-30-40
      - actions-40-50
      - actions-50-60
      - doctor-20-30
      - doctor-30-40
      - doctor-40-50
      - doctor-50-60
