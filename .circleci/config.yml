version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

commands:
  install-root:
    steps:
      - run:
          name: Install root test dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -c requirements.txt -e ".[test]" "PyYAML==6.0.2"
  install-commerce:
    steps:
      - install-root
      - run:
          name: Install commerce dependencies
          command: python -m pip install -r clearglass-commerce/control-plane/requirements.txt

jobs:
  pytest-root:
    executor: py
    steps:
      - checkout
      - install-root
      - run: python -m pytest tests -q
  pytest-artemis:
    executor: py
    steps:
      - checkout
      - install-root
      - run: python -m pytest artemis/tests -q
  pytest-sentinel:
    executor: py
    steps:
      - checkout
      - install-root
      - run: python -m pytest sentinel/tests -q
  pytest-commerce:
    executor: py
    steps:
      - checkout
      - install-commerce
      - run: python -m pytest clearglass-commerce/control-plane/tests -q
  osit-install:
    executor: py
    steps:
      - checkout
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e './osit[dev]'
          python -m pip check
  osit-ruff:
    executor: py
    steps:
      - checkout
      - run: python -m pip install -e './osit[dev]'
      - run: cd osit && ruff check src tests
  osit-tests:
    executor: py
    steps:
      - checkout
      - run: python -m pip install -e './osit[dev]'
      - run: cd osit && pytest --cov=osit --cov-report=term-missing

workflows:
  runtime-diagnostics:
    jobs:
      - pytest-root
      - pytest-artemis
      - pytest-sentinel
      - pytest-commerce
      - osit-install
      - osit-ruff
      - osit-tests
