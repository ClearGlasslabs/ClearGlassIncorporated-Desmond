version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project
commands:
  setup:
    steps:
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.txt -e ".[test]" "PyYAML==6.0.2"
          python -m pip install -r clearglass-commerce/control-plane/requirements.txt
  run-letter:
    parameters:
      letter:
        type: string
    steps:
      - run:
          command: |
            set -euo pipefail
            shopt -s nullglob
            files=(tests/test_<< parameters.letter >>*.py)
            if (( ${#files[@]} == 0 )); then exit 0; fi
            python -m pytest "${files[@]}" -q
jobs:
  a:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: a}}]
  b:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: b}}]
  c:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: c}}]
  d:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: d}}]
  e:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: e}}]
  f:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: f}}]
  g:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: g}}]
  h:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: h}}]
  i:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: i}}]
  j:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: j}}]
  p:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: p}}]
  q:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: q}}]
  r:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: r}}]
  s:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: s}}]
  t:
    executor: py
    steps: [checkout, setup, {run-letter: {letter: t}}]
workflows:
  exact-root-initials:
    jobs: [a, b, c, d, e, f, g, h, i, j, p, q, r, s, t]
