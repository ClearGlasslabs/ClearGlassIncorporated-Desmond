version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

commands:
  install-osit:
    steps:
      - run: python -m pip install -e './osit[dev]'

jobs:
  osit-a-c:
    executor: py
    steps:
      - checkout
      - install-osit
      - run: cd osit && ruff check src/osit/accessibility.py src/osit/acquisition.py src/osit/cli.py src/osit/config.py
  osit-m:
    executor: py
    steps:
      - checkout
      - install-osit
      - run: cd osit && ruff check src/osit/metrics.py src/osit/morphology.py src/osit/multimodal.py
  osit-n-p:
    executor: py
    steps:
      - checkout
      - install-osit
      - run: cd osit && ruff check src/osit/network_builder.py src/osit/provenance.py
  osit-r-v:
    executor: py
    steps:
      - checkout
      - install-osit
      - run: cd osit && ruff check src/osit/resilience.py src/osit/validation.py src/osit/visualization.py src/osit/__init__.py

workflows:
  osit-source-lint-diagnostics:
    jobs:
      - osit-a-c
      - osit-m
      - osit-n-p
      - osit-r-v
