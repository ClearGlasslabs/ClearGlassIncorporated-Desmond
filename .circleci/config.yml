version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  classification-blog:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-blog"}]
  classification-root:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root"}]
  classification-nested:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-nested"}]

workflows:
  classification-location:
    jobs:
      - classification-blog
      - classification-root
      - classification-nested
