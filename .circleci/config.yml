version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  root-a:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-letter-a"}]
  root-b:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-letter-b"}]
  root-c:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-letter-c"}]
  root-d:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-letter-d"}]
  root-e:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-letter-e"}]
  root-f:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-letter-f"}]

workflows:
  exact-root-initial:
    jobs:
      - root-a
      - root-b
      - root-c
      - root-d
      - root-e
      - root-f
