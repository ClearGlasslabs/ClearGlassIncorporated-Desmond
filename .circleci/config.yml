version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

commands:
  regenerate:
    steps:
      - run:
          name: Regenerate search assets
          command: python tools/generate_search_assets.py

jobs:
  sitemap:
    executor: py
    steps:
      - checkout
      - regenerate
      - run: git diff --exit-code -- sitemap.xml
  feed:
    executor: py
    steps:
      - checkout
      - regenerate
      - run: git diff --exit-code -- feed.xml
  intents:
    executor: py
    steps:
      - checkout
      - regenerate
      - run: git diff --exit-code -- data/seo/page-intents.json

workflows:
  search-asset-isolation:
    jobs:
      - sitemap
      - feed
      - intents
