version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  das:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal unknown-prefix-das"}]
  dat:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal unknown-prefix-dat"}]
  dau:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal unknown-prefix-dau"}]
  dav:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal unknown-prefix-dav"}]
  daw:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal unknown-prefix-daw"}]
  dax:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal unknown-prefix-dax"}]
  day:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal unknown-prefix-day"}]
  daz:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal unknown-prefix-daz"}]

workflows:
  exact-da-prefix:
    jobs: [das, dat, dau, dav, daw, dax, day, daz]
