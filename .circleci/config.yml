version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project
commands:
  setup:
    steps:
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.txt -e ".[test]" "PyYAML==6.0.2"
          python -m pip install -r clearglass-commerce/control-plane/requirements.txt
jobs:
  a-e:
    executor: py
    steps: [checkout, setup, {run: "python -m pytest tests/test_[a-e]*.py -q"}]
  f-j:
    executor: py
    steps: [checkout, setup, {run: "python -m pytest tests/test_[f-j]*.py -q --ignore=tests/test_future_buttons.py --ignore=tests/test_holographic_branding.py --ignore=tests/test_internal_links.py"}]
  k-o:
    executor: py
    steps: [checkout, setup, {run: "python -m pytest tests/test_[k-o]*.py -q"}]
  p-t:
    executor: py
    steps: [checkout, setup, {run: "python -m pytest tests/test_[p-t]*.py -q --ignore=tests/test_tab_icons.py"}]
  u-z:
    executor: py
    steps: [checkout, setup, {run: "python -m pytest tests/test_[u-z]*.py -q"}]
workflows:
  residual-root-bisect:
    jobs: [a-e, f-j, k-o, p-t, u-z]
