version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  links-validate:
    executor: py
    steps: [checkout, {run: "python scripts/final_integrity_probe.py links validate"}]
  links-report:
    executor: py
    steps: [checkout, {run: "python scripts/final_integrity_probe.py links report"}]
  links-blocks:
    executor: py
    steps: [checkout, {run: "python scripts/final_integrity_probe.py links blocks"}]
  sitemap:
    executor: py
    steps: [checkout, {run: "python scripts/final_integrity_probe.py search sitemap.xml"}]
  feed:
    executor: py
    steps: [checkout, {run: "python scripts/final_integrity_probe.py search feed.xml"}]
  intents:
    executor: py
    steps: [checkout, {run: "python scripts/final_integrity_probe.py search data/seo/page-intents.json"}]

workflows:
  final-generated-deltas:
    jobs: [links-validate, links-report, links-blocks, sitemap, feed, intents]
