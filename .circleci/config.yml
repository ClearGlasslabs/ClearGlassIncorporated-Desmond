version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  generate-search-assets:
    executor: py
    steps:
      - checkout
      - run:
          name: Generate deterministic search assets
          command: python tools/generate_search_assets.py
      - store_artifacts:
          path: sitemap.xml
          destination: generated/sitemap.xml
      - store_artifacts:
          path: feed.xml
          destination: generated/feed.xml
      - store_artifacts:
          path: data/seo/page-intents.json
          destination: generated/page-intents.json

workflows:
  generated-search-assets:
    jobs:
      - generate-search-assets
