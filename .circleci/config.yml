version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  site-reliability:
    executor: py
    steps:
      - checkout
      - run:
          name: Site reliability audit
          command: python scripts/site_reliability_audit.py

  search-assets:
    executor: py
    steps:
      - checkout
      - run:
          name: Generate and verify search assets
          command: |
            python tools/generate_search_assets.py
            git diff --exit-code -- sitemap.xml feed.xml data/seo/page-intents.json

  seo-audit:
    executor: py
    steps:
      - checkout
      - run:
          name: SEO and JSON-LD audit
          command: python tools/seo_audit.py

  internal-links:
    executor: py
    steps:
      - checkout
      - run:
          name: Internal-link generator check
          command: python tools/internal_links.py --check

  workflow-doctor:
    executor: py
    steps:
      - checkout
      - run:
          name: Install PyYAML
          command: python -m pip install "PyYAML==6.0.2"
      - run:
          name: Workflow Doctor
          command: python scripts/workflow_doctor.py

  actions-audit:
    executor: py
    steps:
      - checkout
      - run:
          name: Install PyYAML
          command: python -m pip install "PyYAML==6.0.2"
      - run:
          name: GitHub Actions safety audit
          command: python scripts/audit_github_actions.py

  osint-deck:
    executor: py
    steps:
      - checkout
      - run:
          name: Strict OSINT deck validation
          command: python scripts/osint_deck_release.py --strict

workflows:
  site-integrity-diagnostics:
    jobs:
      - site-reliability
      - search-assets
      - seo-audit
      - internal-links
      - workflow-doctor
      - actions-audit
      - osint-deck
