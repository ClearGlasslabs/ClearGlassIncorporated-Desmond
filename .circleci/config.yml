version: 2.1
executors:
  py:
    docker:
      - image: cimg/python:3.11-node
commands:
  setup:
    steps:
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.txt -e ".[test]" "PyYAML==6.0.2"
          python -m pip install -r clearglass-commerce/control-plane/requirements.txt
  run-globs:
    parameters:
      patterns:
        type: string
    steps:
      - run:
          command: |
            set -euo pipefail
            shopt -s nullglob
            files=()
            for pattern in << parameters.patterns >>; do
              matched=($pattern)
              files+=("${matched[@]}")
            done
            if (( ${#files[@]} == 0 )); then exit 0; fi
            python -m pytest "${files[@]}" -q
jobs:
  a-agent:
    executor: py
    steps: [checkout, setup, {run-globs: {patterns: "tests/test_agent*.py tests/test_aegis*.py"}}]
  a-audit:
    executor: py
    steps: [checkout, setup, {run-globs: {patterns: "tests/test_access*.py tests/test_adaptive*.py tests/test_alert*.py tests/test_analytics*.py tests/test_artemis*.py tests/test_asset*.py tests/test_audit*.py tests/test_authority*.py tests/test_auto*.py"}}]
  d-data:
    executor: py
    steps: [checkout, setup, {run-globs: {patterns: "tests/test_data*.py tests/test_defender*.py"}}]
  d-deploy:
    executor: py
    steps: [checkout, setup, {run-globs: {patterns: "tests/test_deploy*.py tests/test_design*.py tests/test_digital*.py"}}]
  i-index:
    executor: py
    steps: [checkout, setup, {run-globs: {patterns: "tests/test_index*.py tests/test_internal*.py"}}]
  i-intel:
    executor: py
    steps: [checkout, setup, {run-globs: {patterns: "tests/test_intel*.py tests/test_ip*.py tests/test_invest*.py"}}]
  s-search:
    executor: py
    steps: [checkout, setup, {run-globs: {patterns: "tests/test_search*.py tests/test_seo*.py tests/test_sitemap*.py"}}]
  s-security:
    executor: py
    steps: [checkout, setup, {run-globs: {patterns: "tests/test_security*.py tests/test_sentinel*.py"}}]
  s-site:
    executor: py
    steps: [checkout, setup, {run-globs: {patterns: "tests/test_site*.py tests/test_store*.py tests/test_stripe*.py tests/test_stream*.py tests/test_system*.py"}}]
workflows:
  residual-root-families:
    jobs: [a-agent, a-audit, d-data, d-deploy, i-index, i-intel, s-search, s-security, s-site]
