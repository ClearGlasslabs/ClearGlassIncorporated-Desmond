version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  generate-and-push:
    executor: py
    steps:
      - checkout
      - run:
          name: Generate deterministic search assets
          command: python tools/generate_search_assets.py
      - run:
          name: Commit generated assets to disposable verification branch
          command: |
            set -euo pipefail
            git config user.name "CircleCI Verification"
            git config user.email "circleci-verification@users.noreply.github.com"
            git add sitemap.xml feed.xml data/seo/page-intents.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore(seo): regenerate deterministic search assets"
            git push origin "HEAD:${CIRCLE_BRANCH}"

workflows:
  generated-search-assets:
    jobs:
      - generate-and-push
