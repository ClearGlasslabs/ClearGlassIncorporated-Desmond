version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

commands:
  install-osit:
    steps:
      - run: python -m pip install -e './osit[dev]'

jobs:
  config-e:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check --select E src/osit/config.py"}]
  config-f:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check --select F src/osit/config.py"}]
  config-i:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check --select I src/osit/config.py"}]
  config-up:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check --select UP src/osit/config.py"}]
  config-b:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check --select B src/osit/config.py"}]
  config-sim:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check --select SIM src/osit/config.py"}]

workflows:
  osit-config-rule-diagnostics:
    jobs:
      - config-e
      - config-f
      - config-i
      - config-up
      - config-b
      - config-sim
