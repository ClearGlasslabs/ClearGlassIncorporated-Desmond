version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  sitemap-urls:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py sitemap-urls"}]
  sitemap-lastmods:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py sitemap-lastmods"}]
  sitemap-graph:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py sitemap-graph"}]
  sitemap-bytes:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py sitemap-bytes"}]
  intent-routes:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py intent-routes"}]
  intent-existing:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py intent-existing"}]
  intent-graph:
    executor: py
    steps: [checkout, {run: "python scripts/generated_delta_probe.py intent-graph"}]

workflows:
  generated-delta-shape:
    jobs: [sitemap-urls, sitemap-lastmods, sitemap-graph, sitemap-bytes, intent-routes, intent-existing, intent-graph]
