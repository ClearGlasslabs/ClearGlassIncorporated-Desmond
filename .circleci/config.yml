version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  d-a-i:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-second-abcdefghi"}]
  d-j-r:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-second-jklmnopqr"}]
  d-s-z:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-second-stuvwxyz"}]
  d-other:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-second-other"}]

workflows:
  d-page-prefix:
    jobs:
      - d-a-i
      - d-j-r
      - d-s-z
      - d-other
