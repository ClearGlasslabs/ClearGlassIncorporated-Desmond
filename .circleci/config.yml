version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

commands:
  setup:
    steps:
      - run: python -m pip install "PyYAML==6.0.2"

jobs:
  actions-30-35:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py actions 30 35"}]
  actions-35-40:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py actions 35 40"}]
  actions-50-55:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py actions 50 55"}]
  actions-55-60:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py actions 55 60"}]
  doctor-30-35:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py doctor 30 35"}]
  doctor-35-40:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py doctor 35 40"}]
  doctor-50-55:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py doctor 50 55"}]
  doctor-55-60:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py doctor 55 60"}]

workflows:
  workflow-safety-bisect:
    jobs:
      - actions-30-35
      - actions-35-40
      - actions-50-55
      - actions-55-60
      - doctor-30-35
      - doctor-35-40
      - doctor-50-55
      - doctor-55-60
