version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  da-a-i:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-third-abcdefghi"}]
  da-j-r:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-third-jklmnopqr"}]
  da-s-z:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-third-stuvwxyz"}]
  da-other:
    executor: py
    steps: [checkout, {run: "python scripts/circleci_probe.py internal classification-root-third-other"}]

workflows:
  da-page-prefix:
    jobs:
      - da-a-i
      - da-j-r
      - da-s-z
      - da-other
