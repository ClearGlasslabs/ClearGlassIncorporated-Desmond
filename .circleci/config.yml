version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

commands:
  install-root:
    steps:
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.txt -e ".[test]" "PyYAML==6.0.2"
  install-osit:
    steps:
      - run: python -m pip install -e './osit[dev]'

jobs:
  root-future-buttons:
    executor: py
    steps: [checkout, install-root, {run: "python -m pytest tests/test_future_buttons.py -q"}]
  root-holographic:
    executor: py
    steps: [checkout, install-root, {run: "python -m pytest tests/test_holographic_branding.py -q"}]
  root-internal-links:
    executor: py
    steps: [checkout, install-root, {run: "python -m pytest tests/test_internal_links.py -q"}]
  root-tab-icons:
    executor: py
    steps: [checkout, install-root, {run: "python -m pytest tests/test_tab_icons.py -q"}]
  root-deployment-containment:
    executor: py
    steps: [checkout, install-root, {run: "python -m pytest tests/test_deployment_workflow_containment.py -q"}]
  osit-ruff-src:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check src"}]
  osit-ruff-tests:
    executor: py
    steps: [checkout, install-osit, {run: "cd osit && ruff check tests"}]

workflows:
  residual-runtime-diagnostics:
    jobs:
      - root-future-buttons
      - root-holographic
      - root-internal-links
      - root-tab-icons
      - root-deployment-containment
      - osit-ruff-src
      - osit-ruff-tests
