version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

jobs:
  sitemap-urls:
    executor: py
    steps: [checkout, {run: "python scripts/generated_semantic_probe.py sitemap-urls"}]
  sitemap-lastmods:
    executor: py
    steps: [checkout, {run: "python scripts/generated_semantic_probe.py sitemap-lastmods"}]
  sitemap-order:
    executor: py
    steps: [checkout, {run: "python scripts/generated_semantic_probe.py sitemap-order"}]
  sitemap-bytes:
    executor: py
    steps: [checkout, {run: "python scripts/generated_semantic_probe.py sitemap-bytes"}]
  intent-header:
    executor: py
    steps: [checkout, {run: "python scripts/generated_semantic_probe.py intent-header"}]
  intent-routes:
    executor: py
    steps: [checkout, {run: "python scripts/generated_semantic_probe.py intent-routes"}]
  intent-records:
    executor: py
    steps: [checkout, {run: "python scripts/generated_semantic_probe.py intent-records"}]
  intent-order:
    executor: py
    steps: [checkout, {run: "python scripts/generated_semantic_probe.py intent-order"}]
  intent-graph:
    executor: py
    steps: [checkout, {run: "python scripts/generated_semantic_probe.py intent-graph"}]
  intent-bytes:
    executor: py
    steps: [checkout, {run: "python scripts/generated_semantic_probe.py intent-bytes"}]

workflows:
  generated-semantic-drift:
    jobs:
      - sitemap-urls
      - sitemap-lastmods
      - sitemap-order
      - sitemap-bytes
      - intent-header
      - intent-routes
      - intent-records
      - intent-order
      - intent-graph
      - intent-bytes
