version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project
commands:
  setup:
    steps:
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.txt -e ".[test]" "PyYAML==6.0.2"
          python -m pip install -r clearglass-commerce/control-plane/requirements.txt
jobs:
  future-buttons:
    executor: py
    steps: [checkout, setup, {run: "python -m pytest tests/test_future_buttons.py -q"}]
  holographic:
    executor: py
    steps: [checkout, setup, {run: "python -m pytest tests/test_holographic_branding.py -q"}]
  internal-links:
    executor: py
    steps: [checkout, setup, {run: "python -m pytest tests/test_internal_links.py -q"}]
  tab-icons:
    executor: py
    steps: [checkout, setup, {run: "python -m pytest tests/test_tab_icons.py -q"}]
  root-other:
    executor: py
    steps:
      - checkout
      - setup
      - run: "python -m pytest tests -q --ignore=tests/test_future_buttons.py --ignore=tests/test_holographic_branding.py --ignore=tests/test_internal_links.py --ignore=tests/test_tab_icons.py"
workflows:
  latest-root-diagnostics:
    jobs: [future-buttons, holographic, internal-links, tab-icons, root-other]
