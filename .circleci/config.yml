version: 2.1

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    working_directory: ~/project

commands:
  setup:
    steps:
      - run: python -m pip install "PyYAML==6.0.2"

jobs:
  actions-0-20:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py actions 0 20"}]
  actions-20-40:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py actions 20 40"}]
  actions-40-60:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py actions 40 60"}]
  actions-60-end:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py actions 60 1000"}]
  doctor-0-20:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py doctor 0 20"}]
  doctor-20-40:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py doctor 20 40"}]
  doctor-40-60:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py doctor 40 60"}]
  doctor-60-end:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py doctor 60 1000"}]
  doctor-local:
    executor: py
    steps: [checkout, setup, {run: "python scripts/workflow_probe.py doctor-local"}]

workflows:
  workflow-safety-diagnostics:
    jobs:
      - actions-0-20
      - actions-20-40
      - actions-40-60
      - actions-60-end
      - doctor-0-20
      - doctor-20-40
      - doctor-40-60
      - doctor-60-end
      - doctor-local
